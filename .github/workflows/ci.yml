name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B --no-transfer-progress verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: fastsearch-persons-jar
          path: target/fastsearch-persons.jar
          if-no-files-found: error
          retention-days: 7
