name: Feature request
description: Proposer une amélioration fonctionnelle ou technique
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème ou besoin
      description: Quel cas d'usage cette évolution couvre-t-elle ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Décrire la solution envisagée.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considérées
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Contraintes du projet
      options:
        - label: Les données restent synthétiques.
          required: true
        - label: Les résultats restent des candidats, jamais des identifications.
          required: true
        - label: Aucun secret ni donnée personnelle ne sera ajouté au dépôt.
          required: true
        - label: La documentation et le changelog seront mis à jour si nécessaire.
          required: true
