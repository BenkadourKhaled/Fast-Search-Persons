name: Feature request
description: Proposer une amélioration fonctionnelle ou visuelle
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème ou besoin
      description: Quel cas d'usage cette évolution couvre-t-elle ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Décrire la solution envisagée.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Contraintes du projet
      options:
        - label: Les deux langues FR/AR et le mode RTL seront vérifiés.
          required: true
        - label: Aucun mock ou mode démo ne sera ajouté.
          required: true
        - label: Les données affichées restent synthétiques.
          required: true
