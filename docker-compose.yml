name: fastsearch-persons

# Stack locale complète : PostgreSQL 16, backend Spring Boot, frontend Nginx.
# En production, terminer TLS sur un reverse proxy et remplacer les comptes de
# démonstration. Voir docs/deployment.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastsearch
      POSTGRES_USER: fastsearch
      POSTGRES_PASSWORD: ${FASTSEARCH_DB_PASSWORD:-fastsearch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastsearch -d fastsearch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fastsearch

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${FASTSEARCH_BIND_ADDRESS:-127.0.0.1}:${FASTSEARCH_BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      FASTSEARCH_DB_URL: jdbc:postgresql://postgres:5432/fastsearch
      FASTSEARCH_DB_USER: fastsearch
      FASTSEARCH_DB_PASSWORD: ${FASTSEARCH_DB_PASSWORD:-fastsearch}
      FASTSEARCH_INDEX_PATH: /app/data/index
      FASTSEARCH_DEMO_ENABLED: ${FASTSEARCH_DEMO_ENABLED:-true}
      FASTSEARCH_SECURITY_STORE: jdbc
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=75}"
    volumes:
      - indexdata:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    networks:
      - fastsearch

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FASTSEARCH_BIND_ADDRESS:-127.0.0.1}:${FASTSEARCH_HTTP_PORT:-8081}:80"
    environment:
      BACKEND_UPSTREAM: http://backend:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - fastsearch

volumes:
  pgdata:
    name: fastsearch-persons-pgdata
  indexdata:
    name: fastsearch-persons-indexdata

networks:
  fastsearch:
    name: fastsearch-persons
